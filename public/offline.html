<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline - CivicGuard</title>
<style>
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 1.25rem env(safe-area-inset-bottom);font-family:system-ui,sans-serif;background:#fff;color:#1f2937}
  main{max-width:26rem;text-align:center}
  h1{font-size:1.4rem;margin:0 0 .5rem}
  p{line-height:1.6;margin:.4rem 0}
  button{margin-top:1rem;min-height:44px;padding:0 1.25rem;border:0;border-radius:.5rem;background:#7a1f1f;color:#fff;font-weight:600;font-size:1rem}
  @media (prefers-color-scheme:dark){body{background:#111827;color:#f3f4f6}}
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>CivicGuard can't load right now. Check your connection and try again.</p>
  <p><strong>In immediate danger? Call 911.</strong></p>
  <button type="button" onclick="location.reload()">Retry</button>
</main>
</body>
</html>
