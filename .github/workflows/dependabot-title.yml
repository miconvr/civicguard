name: Dependabot title

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  strip-count:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Remove update count from the PR title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          OLD_TITLE: ${{ github.event.pull_request.title }}
        run: |
          NEW_TITLE=$(printf '%s' "$OLD_TITLE" | sed -E 's/ with [0-9]+ updates?$//')
          if [ "$NEW_TITLE" != "$OLD_TITLE" ]; then
            gh pr edit "$PR_URL" --title "$NEW_TITLE"
          fi
