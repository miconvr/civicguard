name: Website performance

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit the live site on a throttled mobile connection
        env:
          PERF_URL: https://civicguard.wasmer.app/
        run: npm run audit:production

      - name: Check mobile layout and basic accessibility
        env:
          PERF_URL: https://civicguard.wasmer.app
        run: npm run audit:mobile
