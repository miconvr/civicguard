name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Prepare application environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run application tests
        run: php artisan test

      - name: Build production assets
        run: npm run build

      - name: Check compressed asset budgets
        run: npm run check:performance

      - name: Prepare isolated browser-test database
        run: |
          touch /tmp/civicguard-e2e.sqlite
          APP_ENV=testing DB_CONNECTION=sqlite DB_DATABASE=/tmp/civicguard-e2e.sqlite SESSION_DRIVER=file CACHE_STORE=file PHOTO_DISK_ROOT=/tmp/civicguard-e2e-storage CIVICGUARD_E2E=1 php artisan migrate:fresh --seed --seeder=Database\\Seeders\\E2eTestSeeder

      - name: Install Chromium for mobile checks
        run: npx playwright install --with-deps chromium

      - name: Check mobile layout and resident report flow
        env:
          PERF_URL: http://127.0.0.1:8000
          E2E_URL: http://127.0.0.1:8000
        run: |
          server_pid_file=/tmp/civicguard-server.pid
          server_stop_file=/tmp/civicguard-server.stop
          rm -f "$server_pid_file" "$server_stop_file"
          command -v fuser >/dev/null || { echo "fuser is required to clean up a stale PHP test listener"; exit 1; }
          fuser -k 8000/tcp >/dev/null 2>&1 || true

          # Keep Laravel's test server available if its child process exits
          # unexpectedly during the browser flow. Preserve the shared test DB,
          # sessions, and uploads across restarts.
          (
            while [ ! -e "$server_stop_file" ]; do
              APP_ENV=testing LOG_CHANNEL=stderr LOG_LEVEL=warning DB_CONNECTION=sqlite DB_DATABASE=/tmp/civicguard-e2e.sqlite SESSION_DRIVER=file CACHE_STORE=file PHOTO_DISK_ROOT=/tmp/civicguard-e2e-storage php artisan serve --no-reload --host=127.0.0.1 --port=8000 >> /tmp/civicguard-server.log 2>&1 &
              server_child_pid=$!
              echo "$server_child_pid" > "$server_pid_file"
              if wait "$server_child_pid"; then
                server_status=0
              else
                server_status=$?
              fi
              [ -e "$server_stop_file" ] && break
              # artisan serve launches a separate PHP listener. If the Artisan
              # process crashes, remove its orphan before restarting on port 8000.
              fuser -k 8000/tcp >/dev/null 2>&1 || true
              echo "Laravel test server exited with status $server_status; restarting." >> /tmp/civicguard-server.log
              sleep 1
            done
          ) &
          supervisor_pid=$!

          cleanup() {
            status=$?
            touch "$server_stop_file"
            kill "$supervisor_pid" 2>/dev/null || true
            if [ -f "$server_pid_file" ]; then
              kill "$(cat "$server_pid_file")" 2>/dev/null || true
            fi
            fuser -k 8000/tcp >/dev/null 2>&1 || true
            wait "$supervisor_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              tail -n 80 /tmp/civicguard-server.log
            fi
            exit "$status"
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 3 http://127.0.0.1:8000/ > /dev/null; then
              break
            fi
            if ! kill -0 "$supervisor_pid" 2>/dev/null; then
              cat /tmp/civicguard-server.log
              exit 1
            fi
            sleep 1
          done

          if ! curl --silent --fail --max-time 3 http://127.0.0.1:8000/ > /dev/null; then
            cat /tmp/civicguard-server.log
            exit 1
          fi

          npm run audit:mobile
          npm run e2e:reports
