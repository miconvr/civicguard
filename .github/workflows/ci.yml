name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Prepare application environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run application tests
        run: php artisan test

      - name: Build production assets
        run: npm run build

      - name: Check compressed asset budgets
        run: npm run check:performance

      - name: Prepare isolated browser-test database
        run: |
          touch /tmp/civicguard-e2e.sqlite
          APP_ENV=testing DB_CONNECTION=sqlite DB_DATABASE=/tmp/civicguard-e2e.sqlite SESSION_DRIVER=file CACHE_STORE=file PHOTO_DISK_ROOT=/tmp/civicguard-e2e-storage CIVICGUARD_E2E=1 php artisan migrate:fresh --seed --seeder=Database\\Seeders\\E2eTestSeeder

      - name: Install Chromium for mobile checks
        run: npx playwright install --with-deps chromium

      - name: Check mobile layout and resident report flow
        env:
          PERF_URL: http://127.0.0.1:8000
          E2E_URL: http://127.0.0.1:8000
        run: |
          # Keep the test server in one stable process. The browser checks run
          # sequentially, and PHP_CLI_SERVER_WORKERS can make the CLI server's
          # worker pool exit between redirected form requests in CI.
          APP_ENV=testing LOG_CHANNEL=stderr LOG_LEVEL=warning DB_CONNECTION=sqlite DB_DATABASE=/tmp/civicguard-e2e.sqlite SESSION_DRIVER=file CACHE_STORE=file PHOTO_DISK_ROOT=/tmp/civicguard-e2e-storage php artisan serve --no-reload --host=127.0.0.1 --port=8000 > /tmp/civicguard-server.log 2>&1 &
          server_pid=$!

          cleanup() {
            status=$?
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              tail -n 80 /tmp/civicguard-server.log
            fi
            exit "$status"
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 3 http://127.0.0.1:8000/ > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/civicguard-server.log
              exit 1
            fi
            sleep 1
          done

          if ! curl --silent --fail --max-time 3 http://127.0.0.1:8000/ > /dev/null; then
            cat /tmp/civicguard-server.log
            exit 1
          fi

          npm run audit:mobile
          npm run e2e:reports
