name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Prepare application environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run application tests
        run: php artisan test

      - name: Build production assets
        run: npm run build

      - name: Check compressed asset budgets
        run: npm run check:performance

      - name: Install Chromium for mobile checks
        run: npx playwright install --with-deps chromium

      - name: Start the local app
        run: |
          touch /tmp/civicguard-ci.sqlite
          DB_CONNECTION=sqlite DB_DATABASE=/tmp/civicguard-ci.sqlite SESSION_DRIVER=file CACHE_STORE=file php artisan serve --host=127.0.0.1 --port=8000 > /tmp/civicguard-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/civicguard-server.log
          exit 1

      - name: Check mobile layout and accessibility
        env:
          PERF_URL: http://127.0.0.1:8000
        run: npm run audit:mobile
