name: Website uptime

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the production health endpoint
        env:
          HEALTH_URL: https://civicguard.wasmer.app/up
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 --retry 2 --retry-delay 5 --retry-all-errors "$HEALTH_URL")"
          test "$status" = '200'

      - name: Notify the configured Slack webhook on failure
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.UPTIME_ALERT_WEBHOOK }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$ALERT_WEBHOOK" ]; then
            echo "UPTIME_ALERT_WEBHOOK is not configured; GitHub Actions notifications remain available."
            exit 0
          fi
          payload="$(jq -nc --arg text "CivicGuard uptime check failed: ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}" '{text: $text}')"
          curl --silent --show-error --fail --max-time 10 \
            -H 'Content-Type: application/json' \
            --data "$payload" "$ALERT_WEBHOOK"
