kind: wasmer.io/App.v0
owner: miconvr
name: civicguard

# Wasmer assigns app_id and the package digest to each deployed app version.
# Keep those generated values out of this reusable source configuration.
annotations:
  anybuild.run/config:
    composer_build_script: post-update-cmd
    composer_enable: true
    name: out
    node_build_command: npm run build
    node_install_inputs:
      - package.json
    node_package_manager: npm
    npm_version: '11'
    php_framework: laravel
    php_public_dir: public
    phpix: true
  anybuild.run/provider: laravel
  anybuild.run/version: 0.33.0
  wasmer.io/version: 7.5.0

enableDatabase: true
enable_email: true

env:
  APP_DEBUG: 'false'
  APP_ENV: production
  APP_URL: https://civicguard.wasmer.app
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  PHOTO_DISK_ROOT: /data
  PHPIX_PHP_THREADS: '4'

jobs:
  - name: run-laravel-migrations
    trigger: post-deployment
    action:
      execute:
        command: php
        cli_args:
          - artisan
          - migrate
          - --force
          - --no-interaction
        timeout: 5m

volumes:
  - name: data
    mount: /data
